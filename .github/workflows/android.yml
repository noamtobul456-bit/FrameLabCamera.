name: Master Build FrameLab Camera APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  master-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: 4. Universal License Auto-Acceptance
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a637b3701154339b908f39485c0a27a14" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a637b3701154339b908f39485c0a27a14" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Generate or Fix Gradle Wrapper and Permissions
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew
          chmod -R 777 .

      - name: 6. Install Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: 7. Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameLabCamera-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

